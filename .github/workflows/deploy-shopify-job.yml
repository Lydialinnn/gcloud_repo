name: Deploy Shopify Details ETL Job

on:
  push:
    branches: [ main ]
    paths:
      - 'cloud-run-jobs/shopify-job-1/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Build and Deploy'
        run: |
          # 1. Move into the specific subfolder where your code lives
          cd cloud-run-jobs/shopify-job
          
          # 2. Run your exact command, but using GitHub Secrets for the Project ID
          gcloud run jobs deploy valor-shopify-details-etl-job \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=northamerica-northeast2 \
            --source . \
            --task-timeout=3600 \
            --memory=2Gi \
            --service-account=valor-scheduler-invoker@valor-sales.iam.gserviceaccount.com \
            --set-env-vars="GCP_PROJECT_ID=valor-sales,BIGQUERY_DATASET=valor_shopify_line_item,BIGQUERY_TABLE=order_line_item,BIGQUERY_TABLE_fulfilled=fulfilled_line_item,SECRET_NAME=valor_shopify_cred"
